# Include inside the existing HTTPS vhost BEFORE the gateway catch-all.
RedirectMatch 302 ^/callbuddy$ /callbuddy/
ProxyPass /callbuddy/ http://127.0.0.1:4177/ connectiontimeout=5 timeout=600
ProxyPassReverse /callbuddy/ http://127.0.0.1:4177/
<Location /callbuddy/>
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"
        Require ip 127.0.0.1 ::1 192.168.2.0/24 100.64.0.0/10
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "same-origin"
</Location>
