[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "call-assistant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2,<3", "alembic>=1.14,<2", "httpx>=0.28,<1", "websockets>=15,<17", "google-genai>=1.50,<3", "aiortc>=1.13,<2", "numpy>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/call_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

